<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>热点情报台</title>
<style>
:root{--bg:#0b1220;--panel:#121d2e;--panel2:#172439;--line:#26364d;--text:#edf3fb;--muted:#9aabc1;--blue:#7cb8ff;--green:#8ce0bd;--orange:#ffc27d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:24px max(18px,calc((100vw - 1180px)/2));border-bottom:1px solid var(--line);background:#0e1726}header .top{display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:24px;margin:0;letter-spacing:.3px}p{margin:6px 0;color:var(--muted)}.tag{border:1px solid var(--line);border-radius:99px;padding:5px 10px;color:var(--green);font-size:12px;white-space:nowrap}main{max-width:1180px;margin:22px auto;padding:0 18px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}.toolbar input,.toolbar select,.toolbar button,.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit}.toolbar input{flex:1;min-width:180px}.toolbar button,.btn{cursor:pointer}.toolbar button.primary{background:#2762a8;border-color:#2762a8}.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(290px,.8fr);gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.panelhead{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.panelhead h2{font-size:16px;margin:0}.small{font-size:12px;color:var(--muted)}.list{padding:8px}.item{padding:13px 12px;border-bottom:1px solid #233147;cursor:pointer;border-radius:8px}.item:last-child{border:0}.item:hover,.item.active{background:var(--panel2)}.item h3{font-size:15px;font-weight:600;margin:0 0 7px;line-height:1.45}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px}.pill{padding:2px 7px;border-radius:5px;background:#21354d;color:#b7d8ff}.score{margin-left:auto;color:var(--orange)}.empty{padding:28px 18px;color:var(--muted);text-align:center}.detail{padding:18px}.detail h2{font-size:19px;line-height:1.4;margin:0 0 10px}.detail .actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.detail button{background:#203650;border:1px solid #344d6c;color:var(--text);padding:8px 10px;border-radius:8px;cursor:pointer}.detail textarea{width:100%;min-height:150px;background:#0c1523;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:12px;font:14px/1.65 inherit;resize:vertical}.detail h3{font-size:14px;margin:20px 0 8px}.notice{font-size:12px;color:var(--muted);padding:14px 18px;border-top:1px solid var(--line)}.status{font-size:12px;color:var(--muted)}.footer{margin:18px 0 30px;color:var(--muted);font-size:12px}.sources a{color:var(--blue);text-decoration:none}.sources a:hover{text-decoration:underline}.metrics{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.metric{background:#0c1523;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12px;color:var(--muted)}.metric strong{display:block;color:var(--text);font-size:15px;margin-top:2px}@media(max-width:760px){header .top{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}h1{font-size:22px}.panelhead{padding:13px}.detail{padding:14px}}
</style></head>
<body><header><div class="top"><div><h1>热点情报台</h1><p>全网热点优先 · 快速判断 · 一键生成视频号快讯</p></div><span class="tag" id="liveTag">等待连接数据源</span></div></header>
<main><div class="toolbar"><input id="search" placeholder="搜索热点关键词…"><select id="category"><option value="all">全部领域</option><option>科技</option><option>汽车</option><option>国际</option><option>社会</option><option>商业</option></select><select id="sort"><option value="fresh">最新优先</option><option value="score">选题价值优先</option></select><button class="primary" id="refresh">刷新热点</button></div>
<div class="grid"><section class="panel"><div class="panelhead"><h2>热点榜</h2><span class="small" id="count">加载中…</span></div><div class="list" id="list"><div class="empty">正在读取公开新闻源…</div></div><div class="notice">来源为公开新闻 RSS。榜单分数是辅助筛选指标，不等于平台真实热搜指数。</div></section>
<section class="panel"><div class="panelhead"><h2>快讯生成</h2><span class="small">选中热点后生成</span></div><div class="detail" id="detail"><div class="empty">从左侧选择一条热点，生成标题与口播稿。</div></div></section></div>
<div class="footer">MVP 版本 · 当前先接公开新闻 RSS。微博、X、小红书、视频号的实时榜单需要分别验证数据权限与接口可用性。</div></main>
<script>
const $=s=>document.querySelector(s);let all=[],selected=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function classify(x){const t=(x.title+' '+x.description).toLowerCase();if(/汽车|车企|特斯拉|比亚迪|小鹏|电动车|自动驾驶|车展|motor|tesla|vehicle|ev /.test(t))return'汽车';if(/ai|人工智能|机器人|芯片|科技|模型|robot|artificial intelligence|chip|technology/.test(t))return'科技';if(/股|公司|企业|市场|经济|business|market|company|economy/.test(t))return'商业';if(/政府|战争|总统|外交|国际|国家|election|president|war|world|minister/.test(t))return'国际';return'社会'}
function score(x){let age=(Date.now()-new Date(x.publishedAt||Date.now()).getTime())/36e5;let fresh=Math.max(0,45-Math.max(0,age)*2);let cross=Math.min(25,(x.sourceCount||1)*9);let words=/争议|回应|突然|首发|全球|首次|暴涨|调查|事故|发布|裁员|降价|破纪录|回应|反转|viral|launch|record|recall|ban|surge/i.test(x.title)?18:7;let visual=/机器人|汽车|事故|工厂|发布|测试|robot|car|launch|video|factory/i.test(x.title)?12:5;return Math.round(Math.min(99,fresh+cross+words+visual))}
function normalize(x){x.category=classify(x);x.score=score(x);return x}
async function load(){ $('#liveTag').textContent='正在更新…';$('#refresh').disabled=true;try{let r=await fetch('/api/news',{cache:'no-store'});if(!r.ok)throw Error('接口返回 '+r.status);let d=await r.json();all=(d.items||[]).map(normalize);$('#liveTag').textContent='公开新闻源已连接';if(!all.length)$('#list').innerHTML='<div class="empty">数据源暂时没有返回内容，请稍后刷新。</div>';render()}catch(e){$('#liveTag').textContent='数据接口未连接';$('#list').innerHTML='<div class="empty">暂时无法连接线上采集接口。请先按 README 部署 Pages 项目后再试。<br><br>'+esc(e.message)+'</div>';$('#count').textContent='暂无数据'}finally{$('#refresh').disabled=false}}
function render(){let q=$('#search').value.trim().toLowerCase(),cat=$('#category').value,sort=$('#sort').value;let arr=all.filter(x=>(!q||(x.title+' '+x.description+' '+x.source).toLowerCase().includes(q))&&(cat==='all'||x.category===cat));arr.sort((a,b)=>sort==='score'?b.score-a.score:new Date(b.publishedAt)-new Date(a.publishedAt));$('#count').textContent=`${arr.length} 条 · ${all.length} 条采集`;if(!arr.length){$('#list').innerHTML='<div class="empty">没有匹配的热点。</div>';return}$('#list').innerHTML=arr.map(x=>`<article class="item ${selected&&selected.url===x.url?'active':''}" data-url="${esc(x.url)}"><h3>${esc(x.title)}</h3><div class="meta"><span class="pill">${esc(x.category)}</span><span>${esc(x.source||'公开新闻源')}</span><span>${timeAgo(x.publishedAt)}</span><span class="score">选题参考分 ${x.score}</span></div></article>`).join('');document.querySelectorAll('.item').forEach(el=>el.onclick=()=>choose(el.dataset.url))}
function timeAgo(s){let h=Math.max(0,Math.floor((Date.now()-new Date(s||Date.now()))/36e5));return h<1?'1小时内':h<24?h+'小时前':Math.floor(h/24)+'天前'}
function choose(url){selected=all.find(x=>x.url===url);if(!selected)return;render();let x=selected;let title1=`${x.title}，最新进展来了`;let title2=`刚刚传来消息：${x.title}`;let title3=`${x.title}，这件事值得关注`;let script=`【快讯】${x.title}。\n\n根据${x.source||'公开新闻报道'}发布的信息，${strip(x.description)||'相关细节仍需进一步核实。'}\n\n目前需要关注的是事件后续进展，以及相关方面是否有进一步回应。更多信息以原始信源和后续官方发布为准。`;$('#detail').innerHTML=`<h2>${esc(x.title)}</h2><div class="meta"><span class="pill">${esc(x.category)}</span><span>${esc(x.source)}</span><span>${esc(new Date(x.publishedAt||Date.now()).toLocaleString('zh-CN'))}</span></div><div class="metrics"><div class="metric">选题参考分<strong>${x.score}/100</strong></div><div class="metric">时间新鲜度<strong>${timeAgo(x.publishedAt)}</strong></div><div class="metric">信源<strong>${esc(x.source||'公开新闻')}</strong></div></div><p>${esc(strip(x.description)||'暂无摘要。建议打开原文核实详情。')}</p><div class="actions"><button id="openSource">打开原始信源 ↗</button><button id="copyAll">复制快讯</button></div><h3>标题备选</h3><textarea id="titles" rows="4">1. ${title1}\n2. ${title2}\n3. ${title3}</textarea><div class="actions"><button id="copyTitles">复制标题</button></div><h3>口播稿初稿（约 30–45 秒）</h3><textarea id="script">${script}</textarea><div class="actions"><button id="copyScript">复制口播稿</button></div><div class="notice" style="padding:10px 0;border:0">注意：口播稿为模板化初稿，发布前必须核实关键事实、时间、数字和官方回应；参考分不是微博等平台的真实热度。</div>`;$('#openSource').onclick=()=>window.open(x.url,'_blank','noopener');$('#copyAll').onclick=()=>copy(title1+'\n\n'+script);$('#copyTitles').onclick=()=>copy($('#titles').value);$('#copyScript').onclick=()=>copy($('#script').value)}
function strip(s){return String(s||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim()}async function copy(s){try{await navigator.clipboard.writeText(s);alert('已复制')}catch(e){alert('复制失败，请手动选择文本')}}
$('#refresh').onclick=load;$('#search').oninput=render;$('#category').onchange=render;$('#sort').onchange=render;load();
</script></body></html>
